[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "domain-lookup-mcp-server"
version = "1.0.0"
description = "An MCP server that provides domain lookup tools for WHOIS and DNS information"
authors = ["Domain Lookup MCP Server"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastmcp = "^3.2.0"
dnspython = "^2.4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7,<10"
pytest-asyncio = ">=0.21,<1.5"
black = "^26.3.1"
mypy = ">=1,<3"

[tool.poetry.scripts]
domain-lookup-mcp-server = "src.main:main"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Don't type-check third-party packages (fastmcp 3.x uses match statements)
ignore_missing_imports = true
follow_imports = "silent"